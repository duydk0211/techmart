name: TechMart CI Pipeline

on:
  pull_request:
    branches:
      - techmart-uat
      - main
  push:
    branches:
      - techmart-uat
      - main

permissions:
  contents: read
  pull-requests: write # Cấp quyền cho bot tự động viết comment vào PR

jobs:
  # ==========================================
  # JOB 1: CHẠY KIỂM THỬ VÀ VERIFY CODE JAVA
  # ==========================================
  build-and-test:
    name: Build & Run All Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verify Multi-Module Build & Execute Tests
        run: |
          mvn clean verify -B
          
  # ==========================================
  # JOB 2: DEEPSEEK TỰ ĐỘNG REVIEW CODE TIẾNG VIỆT
  # ==========================================
  deepseek-code-review:
    name: DeepSeek Automated Code Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get Git Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Review with DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          pip install "openai>=1.30.0,<2.0.0"
          python - << 'EOF'
          import os
          from openai import OpenAI
          # Kết nối đến DeepSeek API (tương thích hoàn toàn chuẩn OpenAI)
          client = OpenAI(
              api_key=os.environ.get("DEEPSEEK_API_KEY"),
              base_url="https://api.deepseek.com",
              timeout=300.0
          )
          with open("pr_diff.txt", "r", encoding="utf-8", errors="ignore") as f:
              full_diff = f.read()
          diff_content = full_diff[:75000]
          if not diff_content.strip():
              review_output = "Không có thay đổi mã nguồn đáng kể để review."
          else:
              prompt = f"""
          Bạn là một Senior Java Software Architect & Security Expert. Hãy phân tích git diff dưới đây và viết một báo cáo Review Code bằng tiếng Việt.
          Định dạng đầu ra BẮT BUỘC theo cấu trúc bảng Markdown như sau:
          ### 🤖 DeepSeek AI Code Review — Diff Changes
          | # | Severity | File | Line | Problem |
          |---|---|---|---|---|
          (Liệt kê các vấn đề tìm thấy. Severity gồm: HIGH, WARNING, INFO. Viết giải thích vấn đề bằng tiếng Việt súc tích, chuyên sâu như senior review).
          Nếu code tốt không có vấn đề gì, hoặc đã được xủ lý các vấn đề trước đó, hãy giải thích ngắn gọn lý do code đạt chuẩn.
          Git Diff cần review:
          ```diff
          {diff_content}
          ```
          """
              response = client.chat.completions.create(
                  model="deepseek-chat",
                  messages=[
                      {"role": "system", "content": "You are a professional software engineer specialized in code review."},
                      {"role": "user", "content": prompt}
                  ],
                  temperature=0.2
              )
              review_output = response.choices[0].message.content
          with open("review_result.md", "w", encoding="utf-8") as f:
              f.write(review_output[:60000])
          EOF
      - name: Post DeepSeek Review to Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reviewComment = fs.readFileSync('review_result.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reviewComment
            });
