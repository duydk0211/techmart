server:
  port: 8080

spring:
  application:
    name: gateway-services
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

techmart:
  core-service:
    url: ${CORE_SERVICE_URL:http://localhost:8081}
  security:
    internal-secret: ${INTERNAL_SECRET:techmart_internal_secret_2026}
  jwt:
    secret: ${JWT_SECRET:techmart_super_secure_jwt_secret_key_2026_at_least_256_bits_long!}
    expiration-seconds: 900
  cors:
    enabled: true
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
