version: '3.8'

# ====================================================================================================
# PROJECT: TECHMART — ELECTRONIC STORE MANAGEMENT SYSTEM
# FILE: docker-compose.yml (SHARED INFRASTRUCTURE SERVICES FOR LOCAL DEV & TESTING)
# SECURITY COMPLIANCE:
#   - All ports are bound to 127.0.0.1 to prevent external network exposure.
#   - All secrets and credentials are loaded dynamically from environment variables.
# ====================================================================================================

services:

  # --------------------------------------------------------------------------------------------------
  # 1. POSTGRESQL 16 (Primary Core Relational Database)
  # --------------------------------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: techmart-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-techmart}
      POSTGRES_USER: ${DB_USERNAME:-${DB_USER:-postgres}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/scriptDB/init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-${DB_USER:-postgres}} -d ${DB_NAME:-techmart}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - techmart-network

  # --------------------------------------------------------------------------------------------------
  # 2. REDIS 7 (Distributed Cache & Lock - Password Protected & Localhost Only)
  # --------------------------------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: techmart-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-techmart_redis_pass_2026}
    command: >
      sh -c "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - techmart-network

  # --------------------------------------------------------------------------------------------------
  # 3. MINIO (S3-Compatible Object Storage - Localhost Only)
  # --------------------------------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: techmart-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"   # S3 API Endpoint for Spring Boot integration
      - "127.0.0.1:9001:9001"   # Web Console Dashboard for Media Management
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${MINIO_ACCESS_KEY:-admin}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${MINIO_SECRET_KEY:-techmart@2026}}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - techmart-network

  # --------------------------------------------------------------------------------------------------
  # 4. MINIO INIT (Automated Multi-Bucket Creation & Public Read Policy Setup)
  # --------------------------------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: techmart-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${MINIO_ACCESS_KEY:-admin}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${MINIO_SECRET_KEY:-techmart@2026}}
      BUCKET_PRODUCTS: ${MINIO_BUCKET_PRODUCTS:-techmart-products}
      BUCKET_BRANDS: ${MINIO_BUCKET_BRANDS:-techmart-brands}
      BUCKET_AVATARS: ${MINIO_BUCKET_AVATARS:-techmart-avatars}
      BUCKET_BANNERS: ${MINIO_BUCKET_BANNERS:-techmart-banners}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 \"\$$MINIO_ROOT_USER\" \"\$$MINIO_ROOT_PASSWORD\";
      for bucket in \"\$$BUCKET_PRODUCTS\" \"\$$BUCKET_BRANDS\" \"\$$BUCKET_AVATARS\" \"\$$BUCKET_BANNERS\"; do
        /usr/bin/mc mb --ignore-existing local/\$$bucket;
        /usr/bin/mc anonymous set download local/\$$bucket;
        echo \"Bucket \$$bucket has been initialized with public download policy.\";
      done;
      exit 0;
      "
    networks:
      - techmart-network

  # --------------------------------------------------------------------------------------------------
  # 5. APACHE KAFKA (KRaft Mode - Self-Contained Cluster Without Zookeeper)
  # --------------------------------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.1
    container_name: techmart-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"   # Host communication port for Spring Boot Producer & Consumer
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,DOCKER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - techmart-network

  # --------------------------------------------------------------------------------------------------
  # 6. KAFKA UI (Web Dashboard for Topic, Message, and Consumer Group Inspection)
  # --------------------------------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: techmart-kafka-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8080"   # Mapped to 8085 to avoid collision with Gateway Service (8080)
    environment:
      KAFKA_CLUSTERS_0_NAME: techmart-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
    depends_on:
      - kafka
    networks:
      - techmart-network

  # --------------------------------------------------------------------------------------------------
  # 7. MAILPIT (Mock SMTP Server & Web Mailbox for Asynchronous Notification Testing)
  # --------------------------------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: techmart-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP server port for Spring Boot JavaMailSender
      - "127.0.0.1:8025:8025"   # Web UI port for reviewing sent emails
    volumes:
      - mailpit_data:/data
    networks:
      - techmart-network

# ====================================================================================================
# NETWORKS & PERSISTENT VOLUMES
# ====================================================================================================
networks:
  techmart-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  kafka_data:
  mailpit_data:
