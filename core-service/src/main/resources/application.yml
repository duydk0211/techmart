server:
  port: 8081

spring:
  application:
    name: core-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/techmart}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

techmart:
  security:
    internal-secret: ${INTERNAL_SECRET:techmart_internal_secret_2026}
  jwt:
    secret: ${JWT_SECRET:techmart_super_secure_jwt_secret_key_2026_at_least_256_bits_long!}
    expiration-seconds: 900
